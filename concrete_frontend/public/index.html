<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <!-- Single official favicon — the v2 512 PNG (favicon.ico is the same
         design, rebuilt from this file for legacy /favicon.ico requests) -->
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="%PUBLIC_URL%/branding/novxani-beton-favicon-v2-512.png"
    />
    <link
      rel="shortcut icon"
      type="image/png"
      href="%PUBLIC_URL%/branding/novxani-beton-favicon-v2-512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="%PUBLIC_URL%/branding/novxani-beton-favicon-v2-512.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12161f" />

    <!-- Google Tag Manager — same-origin bootstrap (tag-init.js), kept external
         so the strict CSP allows it via 'self' with no inline-script hash.
         Loads ONLY when REACT_APP_GTM_ID is set at build time
         (empty/placeholder ⇒ no-op, no analytics). ID is never hardcoded. -->
    <script src="%PUBLIC_URL%/tag-init.js" data-gtm-id="%REACT_APP_GTM_ID%"></script>
    <!-- End Google Tag Manager -->

    <!-- Per-route SEO tags (title, description, canonical, og:title/description/url,
         twitter:title/description) are injected by react-helmet-async.
         Only route-invariant brand/social defaults live here to avoid duplicates. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Novxanı Beton" />
    <meta property="og:image" content="https://novxanibeton.az/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="az_AZ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://novxanibeton.az/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Novxanı Beton — Peşəkar Beton Həlləri və Kalkulyator</title>

    <!-- Local business structured data (Google local search / Maps) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Novxanı Beton",
        "description": "Bakı və Abşeronda yüksək keyfiyyətli hazır beton, beton nasoslama, tərəzi və laboratoriya xidmətləri.",
        "url": "https://novxanibeton.az/",
        "telephone": "+994506209584",
        "email": "info@novxanibeton.az",
        "image": "https://novxanibeton.az/og-image.jpg",
        "logo": "https://novxanibeton.az/branding/novxani-beton-logo-512.png",
        "foundingDate": "2018",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Novxanı",
          "addressRegion": "Bakı",
          "addressCountry": "AZ"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 40.4858529,
          "longitude": 49.8294278
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
          "opens": "00:00",
          "closes": "23:59"
        },
        "areaServed": ["Bakı", "Abşeron", "Novxanı"]
      }
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) — ID from %REACT_APP_GTM_ID% at build time -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=%REACT_APP_GTM_ID%" height="0" width="0" style="display:none;visibility:hidden" title="gtm"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <noscript>Bu saytı görmək üçün JavaScript-i aktivləşdirin.</noscript>
    <div id="root"></div>
  </body>
</html>
